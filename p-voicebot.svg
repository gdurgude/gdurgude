<text font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b6c0d8"><tspan x="26" y="128">Phones a voice agent as a realistic AI patient across</tspan><tspan x="26" y="149">12 scenarios, records each call as MP3 and transcript,</tspan><tspan x="26" y="170">and identifies bugs in the agent's responses.</tspan></text>
