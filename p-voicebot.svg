<text x="100" y="52" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#f8fafc" >AI Voice Bot</text>
<text x="100" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#fbbf24" >AI patient caller · voice QA</text>
