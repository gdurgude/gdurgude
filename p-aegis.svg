<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="280" viewBox="0 0 480 280" role="img" aria-label="Aegis: autonomous incident response copilot with Next.js, evals and CI"><title>Aegis: autonomous incident response copilot with Next.js, evals and CI</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset=".55" stop-color="#120c26"/><stop offset="1" stop-color="#1c1038"/></linearGradient>
<linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="1" stop-color="#f472b6" stop-opacity=".7"/></linearGradient>
<radialGradient id="orbA"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="orbB"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
<clipPath id="card"><rect x="1" y="1" width="478" height="278" rx="20"/></clipPath>
</defs>
<rect width="480" height="280" rx="20" fill="url(#bg)"/>
<g clip-path="url(#card)">
<rect width="480" height="280" fill="url(#grid)"/>

<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<circle cx="52" cy="58" r="60" fill="url(#glow)"><animate attributeName="r" values="50;68;50" dur="4.5s" repeatCount="indefinite"/></circle>
<g transform="translate(20 26)"><rect width="64" height="64" rx="18" fill="#0b1327" fill-opacity=".9" stroke="#22d3ee" stroke-opacity=".7"/><g transform="translate(32 33)"><path d="M0 -22L19 -14V4C19 15 10 21 0 25C-10 21 -19 15 -19 4V-14Z" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
<clipPath id="sh"><path d="M0 -22L19 -14V4C19 15 10 21 0 25C-10 21 -19 15 -19 4V-14Z"/></clipPath>
<g clip-path="url(#sh)"><circle r="12" fill="none" stroke="#22d3ee" stroke-opacity=".35"/><circle r="6" fill="none" stroke="#22d3ee" stroke-opacity=".35"/>
<path d="M0 0L0 -26A26 26 0 0 1 22 -13Z" fill="#22d3ee" fill-opacity=".55"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/></path></g>
<circle cx="8" cy="-6" r="2.6" fill="#fbbf24"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.15;.4;1" dur="3s" repeatCount="indefinite"/></circle></g></g>
<text x="100" y="52" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#f8fafc" >Aegis</text>
<text x="100" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#22d3ee" >Autonomous incident-response copilot</text>
<g transform="translate(369.2 22)"><rect width="87" height="22" rx="11" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><circle cx="12" cy="11" r="3" fill="#22d3ee"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="22" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#e2e8f0" >IN BUILD</text></g>
<text font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b6c0d8"><tspan x="26" y="128">Helps triage production incidents on its own, with</tspan><tspan x="26" y="149">an evaluation harness for the agent behaviour and</tspan><tspan x="26" y="170">CI/deployment configuration.</tspan></text>
<g transform="translate(26 196)"><rect width="63" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="31.5" y="16.2" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">Next.js</text></g><g transform="translate(95 196)"><rect width="83" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="41.5" y="16.2" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">LLM agents</text></g><g transform="translate(184 196)"><rect width="50" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="25.0" y="16.2" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">Evals</text></g><g transform="translate(240 196)"><rect width="50" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="25.0" y="16.2" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">CI/CD</text></g>
</g>
<rect x="1" y="1" width="478" height="278" rx="20" fill="none" stroke="url(#frame)" stroke-width="1.5"/>
