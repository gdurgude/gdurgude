<circle cx="222" cy="114" r="3.5" fill="#34d399"/><text x="238" y="118" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c7d0e4">Build backend services and features in <tspan fill="#34d399" font-weight="700">Python and TypeScript</tspan>, using AI-assisted workflows.</text><circle cx="222" cy="141" r="3.5" fill="#34d399"/><text x="238" y="145" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c7d0e4">Resolved <tspan fill="#34d399" font-weight="700">20+ production issues</tspan> by tracing failures across logic, APIs and data flows.</text><circle cx="222" cy="168" r="3.5" fill="#34d399"/><text x="238" y="172" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c7d0e4">Join architecture discussions and code reviews: API design, performance, maintainability.</text><circle cx="222" cy="195" r="3.5" fill="#34d399"/><text x="238" y="199" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c7d0e4">Build testable components and validate across dev workflows to catch defects early.</text><text x="26" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#8b5cf6" >AUG 2021</text><text x="26" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#94a3b8" >APR 2023</text>
