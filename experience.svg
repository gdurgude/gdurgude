<circle cx="222" cy="356" r="3.5" fill="#8b5cf6"/><text x="238" y="360" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c7d0e4">Built and maintained <tspan fill="#8b5cf6" font-weight="700">REST APIs</tspan> and backend services in Python, Node.js and SQL.</text><circle cx="222" cy="383" r="3.5" fill="#8b5cf6"/><text x="238" y="387" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c7d0e4">Tuned <tspan fill="#8b5cf6" font-weight="700">PostgreSQL and SQLite</tspan> queries for data-heavy workflows to speed up responses.</text><circle cx="222" cy="410" r="3.5" fill="#8b5cf6"/><text x="238" y="414" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#c7d0e4">Added logging and debugging workflows that <tspan fill="#8b5cf6" font-weight="700">cut issue-resolution time by 50%</tspan>.</text>
