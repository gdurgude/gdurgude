<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="280" viewBox="0 0 480 280" role="img" aria-label="Lull: AI voice companion desktop app built with Tauri, React, Deepgram, ElevenLabs, Claude and pgvector"><title>Lull: AI voice companion desktop app built with Tauri, React, Deepgram, ElevenLabs, Claude and pgvector</title>
