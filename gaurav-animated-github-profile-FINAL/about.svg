<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="224" viewBox="0 0 1000 224" role="img" aria-label="About: Gaurav is an AI and full-stack engineer who turns rough ideas into usable software, plays piano, writes his own melodies and teaches others."><title>About: Gaurav is an AI and full-stack engineer who turns rough ideas into usable software, plays piano, writes his own melodies and teaches others.</title><defs><g id="n"><ellipse cx="0" cy="0" rx="5.5" ry="4" transform="rotate(-20)"/><rect x="4" y="-20" width="2" height="20"/><path d="M6 -20 q9 3 6 12 q-1 -6 -6 -7z"/></g><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter><filter id="blur2"><feGaussianBlur stdDeviation="1.2"/></filter><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141A2E"/><stop offset="1" stop-color="#0B0F1C"/></linearGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#F472B6"/></linearGradient><clipPath id="cw"><rect x="722" y="82" width="214" height="24"/></clipPath></defs><rect width="1000" height="224" rx="6" fill="#080A14"/><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2857;1" dur="0.70s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.2857;1" dur="0.70s" fill="freeze"/><text x="40" y="58" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="2" fill="#F8FAFC">HI, I'M GAURAV</text><path d="M40 68 h56 l-7 5 h-49z" fill="#EF4444"/></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5000;1" dur="1.00s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.5000;1" dur="1.00s" fill="freeze"/><text x="40" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#CBD5E1">I'm an AI and full-stack engineer who turns rough ideas into</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5763;1" dur="1.18s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.5763;1" dur="1.18s" fill="freeze"/><text x="40" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#CBD5E1">software people can actually use: from the API underneath to</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6324;1" dur="1.36s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.6324;1" dur="1.36s" fill="freeze"/><text x="40" y="154" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#CBD5E1">the interface on top, with LLMs and voice in between.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6753;1" dur="1.54s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.6753;1" dur="1.54s" fill="freeze"/><text x="40" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#CBD5E1">Off the clock I play piano, write my own melodies and teach</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7093;1" dur="1.72s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.7093;1" dur="1.72s" fill="freeze"/><text x="40" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" fill="#CBD5E1">others. To me, code and music are the same craft.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5455;1" dur="1.10s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.5455;1" dur="1.10s" fill="freeze"/><rect x="700" y="34" width="266" height="96" rx="4" fill="#0A0E1D" stroke="#2A3358"/><circle cx="718" cy="52" r="3.5" fill="#FF5F57"/><circle cx="732" cy="52" r="3.5" fill="#FEBC2E"/><circle cx="746" cy="52" r="3.5" fill="#28C840"/><clipPath id="c0"><rect x="716" y="69" width="0" height="18"><animate attributeName="width" values="0;0;151;151;0" keyTimes="0;0.150;0.300;.93;1" dur="9s" repeatCount="indefinite"/></rect></clipPath><text x="716" y="82" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#60A5FA" clip-path="url(#c0)">async def ship(idea):</text><clipPath id="c1"><rect x="716" y="89" width="0" height="18"><animate attributeName="width" values="0;0;166;166;0" keyTimes="0;0.370;0.520;.93;1" dur="9s" repeatCount="indefinite"/></rect></clipPath><text x="716" y="102" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#34D399" clip-path="url(#c1)">    return idea.build()</text><clipPath id="c2"><rect x="716" y="109" width="0" height="18"><animate attributeName="width" values="0;0;158;158;0" keyTimes="0;0.590;0.740;.93;1" dur="9s" repeatCount="indefinite"/></rect></clipPath><text x="716" y="122" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#94A3B8" clip-path="url(#c2)"># with a little rhythm</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6667;1" dur="1.50s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.6667;1" dur="1.50s" fill="freeze"/><g transform="translate(618,172)"><path d="M-26 -22 H18 L14 14 Q13 22 5 22 H-13 Q-21 22 -22 14Z" fill="#2B3159" stroke="#47528A"/><path d="M18 -14 q14 0 12 12 q-2 10 -15 8" fill="none" stroke="#47528A" stroke-width="3"/><ellipse cx="-4" cy="-21" rx="22" ry="4" fill="#5B3A29"/><ellipse cx="-30" cy="26" rx="0" ry="0"/><ellipse cx="-4" cy="26" rx="34" ry="4" fill="#161B34"/><path d="M-14 -26 q-6 -10 0 -18 t0 -18" fill="none" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="3.6s" begin="0.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -10" dur="3.6s" begin="0.0s" repeatCount="indefinite"/></path><path d="M-4 -26 q-6 -10 0 -18 t0 -18" fill="none" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="3.6s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -10" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></path><path d="M6 -26 q-6 -10 0 -18 t0 -18" fill="none" stroke="#CBD5E1" stroke-width="2.4" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -10" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></path></g></g><rect x=".5" y=".5" width="999" height="223" rx="6" fill="none" stroke="#1E2540"/></svg>