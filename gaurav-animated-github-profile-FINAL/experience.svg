t-size="11" fill="#94A3B8">New York, USA</text><circle cx="62" cy="176" r="3" fill="#FB923C"/><text x="76" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">I build backend services and software modules in Python and TypeScript.</text><circle cx="62" cy="200" r="3" fill="#FB923C"/><text x="76" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">I keep the code clean with object-oriented design and sound architecture.</text><circle cx="62" cy="224" r="3" fill="#FB923C"/><text x="76" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">I trace production problems to their root cause: 20+ resolved, with fewer repeat failures.</text><circle cx="62" cy="248" r="3" fill="#FB923C"/><text x="76" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">I join architecture discussions and review teammates' code.</text><circle cx="62" cy="272" r="3" fill="#FB923C"/><text x="76" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">I look for ways to make the applications I work on run faster and more reliably.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5455;1" dur="1.10s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0" keyTimes="0;0.5455;1" dur="1.10s" fill="freeze"/><path d="M28 318 H960 L972 330 V532 H40 L28 520Z" fill="url(#card)" stroke="#2C3556"/><rect x="28" y="332" width="4" height="186" rx="2" fill="#60A5FA"/><text x="56" y="354" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-weight="700" font-size="21" fill="#F8FAFC">Full-Stack Engineer</text><text x="56" y="376" font-family="'Arial Black', 'Helvetica Neue', Impact, Arial, sans-serif" font-weight="700" font-size="14" fill="#60A5F