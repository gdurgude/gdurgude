    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset="1" stop-color="#EEF6FF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0" stop-color="#6D28D9"/>
    <stop offset=".5" stop-color="#0891B2"/>
    <stop offset="1" stop-color="#059669"/>
    <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="orb1"><stop offset="0" stop-color="#6D28D9" stop-opacity=".24"/><stop offset="1" stop-color="#6D28D9" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2"><stop offset="0" stop-color="#0891B2" stop-opacity=".20"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#94A3B8" flood-opacity=".22"/></filter>
</defs>

<rect width="1180" height="610" rx="26" fill="url(#bg)"/>
