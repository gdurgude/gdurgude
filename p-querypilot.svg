<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="280" viewBox="0 0 480 280" role="img" aria-label="QueryPilot Agent: Streamlit chat agent with web search and LangGraph memory, built with Python, LangChain and Groq"><title>QueryPilot Agent: Streamlit chat agent with web search and LangGraph memory, built with Python, LangChain and Groq</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset=".55" stop-color="#120c26"/><stop offset="1" stop-color="#1c1038"/></linearGradient>
<linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="1" stop-color="#f472b6" stop-opacity=".7"/></linearGradient>
<radialGradient id="orbA"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="orbB"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
<clipPath id="card"><rect x="1" y="1" width="478" height="278" rx="20"/></clipPath>
</defs>
<rect width="480" height="280" rx="20" fill="url(#bg)"/>
<g clip-path="url(#card)">
<rect width="480" height="280" fill="url(#grid)"/>

<defs><radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<circle cx="52" cy="58" r="60" fill="url(#glow)"><animate attributeName="r" values="50;68;50" dur="4.5s" repeatCount="indefinite"/></circle>
<g transform="translate(20 26)"><rect width="64" height="64" rx="18" fill="#0b1327" fill-opacity=".9" stroke="#22d3ee" stroke-opacity=".7"/><g transform="translate(30 30)"><circle cx="-3" cy="-3" r="12" fill="none" stroke="#22d3ee" stroke-opacity=".6"><animate attributeName="r" values="12;26" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="-3" cy="-3" r="12" fill="#06202b" stroke="#22d3ee" stroke-width="2.6"/><path d="M6 6L16 16" stroke="#22d3ee" stroke-width="3.8" stroke-linecap="round"/>
<circle r="3.2" fill="#22d3ee"><animateMotion dur="2.4s" repeatCount="indefinite" path="M-3 -9A6 6 0 1 1 -3 3A6 6 0 1 1 -3 -9"/></circle></g></g>
<text x="100" y="52" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#f8fafc" >QueryPilot</text>
<text x="100" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#22d3ee" >Web-search chat agent · Streamlit</text>
<g transform="translate(324 22)"><rect width="132" height="22" rx="11" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><circle cx="12" cy="11" r="3" fill="#22d3ee"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="22" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="600" fill="#e2e8f0" >AGENT + MEMORY</text></g>
<text font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b6c0d8"><tspan x="26" y="128">A Streamlit chat agent that decides when to search</tspan><tspan x="26" y="149">the web and remembers earlier turns with LangGraph</tspan><tspan x="26" y="170">memory. Powered by Groq.</tspan></text>
<g transform="translate(26 196)"><rect width="56" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="28.0" y="16.2" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">Python</text></g><g transform="translate(88 196)"><rect width="76" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="38.0" y="16.2" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">Streamlit</text></g><g transform="translate(170 196)"><rect width="76" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="38.0" y="16.2" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">LangChain</text></g><g transform="translate(252 196)"><rect width="76" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="38.0" y="16.2" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">LangGraph</text></g><g transform="translate(334 196)"><rect width="43" height="24" rx="12.0" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="21.5" y="16.2" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#e5e7eb" text-anchor="middle">Groq</text></g>
<g transform="translate(374 250)"><text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#22d3ee" >view repo</text><path d="M74 -4h8m-3 -3l3 3-3 3" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="1.5s" repeatCount="indefinite"/></path></g>
